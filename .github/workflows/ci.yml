name: Verification

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - architecture-v2
      - fix/recovery-r1-r3-core-stabilization
      - release/recovery-r4-r6-final-acceptance

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Build-time fixture values. Database-writing commands provision their own private target.
      DATABASE_URL: postgresql://unused@127.0.0.1:1/fyp_build
      JWT_SECRET: build-only-session-value-at-least-32-characters
      QR_SECRET: build-only-qr-value-distinct-at-least-32-characters
      REALTIME_SERVICE_SECRET: build-only-realtime-value-at-least-32-characters
      REALTIME_URL: http://127.0.0.1:1
      APP_BASE_URL: https://fixture.example.test
      RUN_SCHEDULED_JOBS: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies and PostgreSQL tooling
        run: |
          npm ci
          curl --fail --silent --show-error --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/fyp-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/fyp-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/fyp-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Generate and validate Prisma
        run: |
          npx --no-install prisma generate
          npx --no-install prisma validate

      - run: npm run lint
      - run: npm run lint:recovery
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:architecture
      - run: npm run test:integration
        env:
          TEST_DATABASE_CONFIRM: FYP_BUS_INTEGRATION
      - run: npm run test:rehearsal
        env:
          TEST_DATABASE_CONFIRM: FYP_BUS_INTEGRATION
          FYP_REQUIRE_POSTGRES_17: "true"
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: git diff --check HEAD^ HEAD

      - name: Install pinned Chromium with bounded retries
        timeout-minutes: 9
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
        run: |
          timeout 120s npx --no-install playwright install-deps chromium
          for attempt in 1 2 3; do
            if timeout 110s npx --no-install playwright install chromium; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          exit 1

      - run: npm run test:e2e
        env:
          TEST_DATABASE_CONFIRM: FYP_BUS_INTEGRATION

      - name: Upload failed browser reports from synthetic fixtures
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
